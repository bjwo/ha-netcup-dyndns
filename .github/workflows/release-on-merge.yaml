name: Auto Release
on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version to release (e.g. v7.0.1)'
        required: true

jobs:
  release:
    if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'update-upstream-')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            INPUT_VERSION="${{ github.event.inputs.version }}"
            UPSTREAM_VERSION="v${INPUT_VERSION#v}"
          else
            BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
            UPSTREAM_VERSION="${BRANCH_NAME#update-upstream-}"
          fi
          ADDON_VERSION="${UPSTREAM_VERSION#v}.0"
          echo "upstream_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "addon_version=$ADDON_VERSION" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream notes
        id: fetch_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_VERSION: ${{ steps.get_version.outputs.upstream_version }}
        run: |
          NOTES=$(gh api repos/stecklars/dynamic-dns-netcup-api/releases/tags/$UPSTREAM_VERSION --jq '.body')
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "notes<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.addon_version }}
          name: Release v${{ steps.get_version.outputs.addon_version }}
          body: |
            ## Upstream Changelog
            ${{ steps.fetch_notes.outputs.notes }}

            ---
            See the [upstream release](https://github.com/stecklars/dynamic-dns-netcup-api/releases/tag/${{ steps.get_version.outputs.upstream_version }}) for more details.
