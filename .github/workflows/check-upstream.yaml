name: Check for upstream updates

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

jobs:
  check-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get current upstream version
        id: current
        run: |
          CURRENT=$(grep -m1 'stecklars/dynamic-dns-netcup-api:' netcup-dyndns/build.yaml | sed 's/.*://')
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Get latest upstream release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh api repos/stecklars/dynamic-dns-netcup-api/releases/latest --jq '.tag_name')
          BODY=$(gh api repos/stecklars/dynamic-dns-netcup-api/releases/latest --jq '.body')
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "notes<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Update if new version available
        if: steps.current.outputs.version != steps.latest.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.current.outputs.version }}
          LATEST: ${{ steps.latest.outputs.version }}
          NOTES: ${{ steps.latest.outputs.notes }}
        run: |
          set -x
          # Derive addon version from upstream tag (strip leading 'v' if present)
          ADDON_VERSION="${LATEST#v}"

          # Update build.yaml
          sed -i "s|stecklars/dynamic-dns-netcup-api:${CURRENT}|stecklars/dynamic-dns-netcup-api:${LATEST}|g" netcup-dyndns/build.yaml

          # Update addon version in config.yaml
          sed -i "s|^version:.*|version: \"${ADDON_VERSION}\"|" netcup-dyndns/config.yaml

          # Update CHANGELOG.md
          echo "# Changelog" > tmp_changelog.md
          echo "" >> tmp_changelog.md
          echo "## ${ADDON_VERSION}" >> tmp_changelog.md
          echo "" >> tmp_changelog.md
          echo "$NOTES" >> tmp_changelog.md
          echo "" >> tmp_changelog.md
          tail -n +3 netcup-dyndns/CHANGELOG.md >> tmp_changelog.md
          mv tmp_changelog.md netcup-dyndns/CHANGELOG.md

          # Create branch and PR
          BRANCH="update-upstream-${LATEST}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add netcup-dyndns/build.yaml netcup-dyndns/config.yaml netcup-dyndns/CHANGELOG.md
          
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          
          git commit -m "Update upstream image to ${LATEST}"
          git push -f origin "$BRANCH"

          cat <<EOF > pr_body.md
A new version of [dynamic-dns-netcup-api](https://github.com/stecklars/dynamic-dns-netcup-api) has been released.

- **Current version:** ${CURRENT}
- **New version:** ${LATEST}
- **Release notes:** https://github.com/stecklars/dynamic-dns-netcup-api/releases/tag/${LATEST}

## Upstream Changelog
${NOTES}

---
This PR updates the base image in \`build.yaml\` and bumps the addon version in \`config.yaml\`.
EOF

          if ! gh pr list --head "$BRANCH" --json number --jq 'length' | grep -q "^[1-9]"; then
            echo "Attempting to create PR..."
            gh pr create \
              --title "Update upstream image to ${LATEST}" \
              --body-file pr_body.md || { 
              echo "ERROR: gh pr create failed!"
              echo "Did you enable 'Allow GitHub Actions to create and approve pull requests' in Settings > Actions > General?"
              exit 1
            }
          else
            echo "PR for branch $BRANCH already exists."
          fi
